[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warhammer-survivors-bot"
version = "0.1.0"
description = "Educational bot for the singleplayer game Warhammer Survivors"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mss>=10",
    "numpy>=2",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Background mode: virtual controller (needs the ViGEmBus driver) + runtime focus hook.
background = ["vgamepad>=0.1", "frida>=17"]

[project.scripts]
warhammer-survivors-bot = "warhammer_survivors_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
warhammer_survivors_bot = ["templates/*.png"]
